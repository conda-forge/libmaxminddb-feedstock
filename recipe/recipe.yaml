schema_version: 1

context:
  name: libmaxminddb
  version: "1.14.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/maxmind/libmaxminddb/releases/download/${{ version }}/libmaxminddb-${{ version }}.tar.gz
  sha256: 65ff92382c71ef6634b8c13e278651a2efa68f1de28ef3c31fc32369fa0bb3e3
  patches:
    - if: win
      then: static-test-helper.patch

build:
  number: 1
  dynamic_linking:
    overlinking_behavior: error
  script:
    - if: win
      then:
        - cmake -S . -B build -G Ninja %CMAKE_ARGS% -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=ON -DCMAKE_INSTALL_PREFIX="%LIBRARY_PREFIX%" -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="%SRC_DIR%/build/bin"
        - cmake --build build
        - if: build_platform == target_platform
          then: ctest --test-dir build --output-on-failure
        - cmake --install build
      else:
        - ./configure --disable-debug --disable-dependency-tracking --disable-silent-rules --prefix="$PREFIX" --build="$BUILD" --host="$HOST"
        - make
        - if: build_platform == target_platform
          then: make check
        - make install

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler('c') }}
    - if: win
      then:
        - cmake
        - ninja
      else:
        - make
        - pkg-config
  run_exports:
    - ${{ pin_subpackage('libmaxminddb') }}

tests:
  - script:
      - if: win
        # Upstream does not build mmdblookup with MSVC (getopt is unavailable).
        then:
          - if not exist %LIBRARY_BIN%\maxminddb.dll exit 1
          - if not exist %LIBRARY_LIB%\maxminddb.lib exit 1
          - if not exist %LIBRARY_INC%\maxminddb.h exit 1
          - if not exist %LIBRARY_INC%\maxminddb_config.h exit 1
        else: mmdblookup -f t/maxmind-db/test-data/GeoIP2-City-Test.mmdb -i 175.16.199.0
    files:
      source:
        - t/maxmind-db/test-data/GeoIP2-City-Test.mmdb

about:
  homepage: https://maxmind.github.io/libmaxminddb/
  license: Apache-2.0
  license_file: LICENSE
  summary: "C library for the MaxMind DB file format"
  description: |
    The libmaxminddb library provides a C library for reading MaxMind DB files, including
    the GeoIP2 databases from MaxMind. This is a custom binary format designed to facilitate
    fast lookups of IP addresses while allowing for great flexibility in the type of
    data associated with an address.
  repository: https://github.com/maxmind/libmaxminddb

extra:
  recipe-maintainers:
    - dbast
